<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Barshtender Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .ad-card { border-radius: 18px; background: rgba(255,255,255,0.025); border: 1px solid rgba(207,232,202,0.14); padding: 24px; }
        .ad-label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #6f6b85; }
        .ad-value { font-size: 15px; font-weight: 600; color: #f2eee8; }
        .ad-btn { font-family: Archivo, sans-serif; cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 11px 18px; border-radius: 999px; background: transparent; border: 1px solid rgba(207,232,202,0.25); color: #cdc9dc; transition: all .18s; }
        .ad-btn:hover { border-color: #cfe8ca; color: #cfe8ca; }
        .ad-btn:disabled { opacity: .5; cursor: default; }
        .status-select { font-family: Archivo, sans-serif; font-size: 13px; font-weight: 700; padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(207,232,202,0.25); color: #f2eee8; cursor: pointer; outline: none; }
        .st-new { border-color: #cfe8ca; color: #cfe8ca; }
        .st-replied { border-color: #8ea7e0; color: #8ea7e0; }
        .st-deposit { border-color: #e6d3a3; color: #e6d3a3; }
        .st-booked { border-color: #b7a3e6; color: #b7a3e6; }
        .st-happened { border-color: #9b97b3; color: #9b97b3; }
        .st-cancelled { border-color: #e98b8b; color: #e98b8b; }
        .ad-modal-bg { position: fixed; inset: 0; z-index: 400; background: rgba(5,4,12,0.8); backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 4vh 16px; }
        .ad-modal-bg.open { display: flex; }
        .ad-modal { width: 100%; max-width: 640px; border-radius: 20px; background: #14101f; border: 1px solid rgba(207,232,202,0.2); padding: clamp(22px, 3.5vw, 36px); animation: btPop .25s ease both; }
        .ad-pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(207,232,202,0.25); color: #cfe8ca; }
    </style>
</head>

<body>
    <!-- ============ LOGIN ============ -->
    <section id="loginView" style="display:none;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 120% at 50% 0%,#1c1340 0%,#0a0913 60%);">
        <div style="width:100%;max-width:400px;border-radius:22px;background:rgba(255,255,255,0.03);border:1px solid rgba(207,232,202,0.16);padding:clamp(28px,5vw,44px);">
            <img src="assets/logo-green-tight.png" alt="Barshtender" style="height:26px;width:auto;display:block;margin:0 auto 26px;">
            <h1 style="margin:0 0 22px;font-size:24px;font-weight:900;letter-spacing:-0.02em;text-align:center;">Admin</h1>
            <form id="loginForm">
                <label class="flabel" for="adUser">Username</label>
                <input class="field" type="text" id="adUser" autocomplete="username" style="margin-bottom:16px;">
                <label class="flabel" for="adPass">Password</label>
                <input class="field" type="password" id="adPass" autocomplete="current-password">
                <span class="ferr" id="loginError"></span>
                <button type="submit" class="btn-mint" style="margin-top:18px;width:100%;font-size:15px;padding:15px;border-radius:12px;">Sign in</button>
            </form>
        </div>
    </section>

    <!-- ============ DASHBOARD ============ -->
    <div id="dashView" style="display:none;">
        <header style="position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(20px,4vw,48px);background:rgba(10,9,19,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(207,232,202,0.12);">
            <div style="display:flex;align-items:center;gap:14px;">
                <img src="assets/logo-green-tight.png" alt="Barshtender" style="height:22px;width:auto;">
                <span style="font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#6f6b85;">Admin</span>
            </div>
            <button id="btnLogout" class="ad-btn">Log out</button>
        </header>

        <main style="max-width:1100px;margin:0 auto;padding:clamp(24px,4vw,44px) clamp(20px,4vw,48px) 100px;">
            <h1 style="margin:0 0 20px;font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-0.02em;">Quote requests</h1>
            <div id="filters" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;"></div>
            <div id="list" style="display:flex;flex-direction:column;gap:16px;"></div>
            <p id="emptyMsg" style="display:none;font-size:16px;color:#6f6b85;font-style:italic;">Nothing here yet.</p>
        </main>
    </div>

    <!-- ============ REPLY MODAL ============ -->
    <div class="ad-modal-bg" id="replyModal">
        <div class="ad-modal">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;">
                <h2 style="margin:0;font-size:22px;font-weight:900;">Reply with a quote</h2>
                <button class="ad-btn" id="replyClose" style="border:none;font-size:18px;padding:4px 10px;">&times;</button>
            </div>
            <p id="replyTo" style="margin:0 0 20px;font-size:14px;color:#9b97b3;"></p>

            <label class="flabel">Subject</label>
            <input class="field" id="rSubject" type="text" style="margin-bottom:16px;">

            <label class="flabel">Price / the numbers <span style="text-transform:none;letter-spacing:0;color:#6f6b85;">(shown big, e.g. "$1,200" or "$950 – $1,200")</span></label>
            <input class="field" id="rPrice" type="text" placeholder="$" style="margin-bottom:16px;">

            <label class="flabel">What's included <span style="text-transform:none;letter-spacing:0;color:#6f6b85;">(one item per line)</span></label>
            <textarea class="field" id="rIncludes" style="min-height:130px;margin-bottom:16px;"></textarea>

            <label class="flabel">Personal message</label>
            <textarea class="field" id="rMessage" style="min-height:110px;" placeholder="Anything you want to say directly…"></textarea>

            <span class="ferr" id="replyError"></span>
            <button id="replySend" class="btn-mint" style="margin-top:14px;width:100%;font-size:15px;padding:15px;border-radius:12px;">Send quote email</button>
        </div>
    </div>

    <script>
        (function () {
            var STATUSES = ['new', 'replied', 'deposit', 'booked', 'happened', 'cancelled'];
            var STATUS_LABELS = { new: 'New', replied: 'Replied', deposit: 'Deposit received', booked: 'Bartenders booked', happened: 'Happened', cancelled: 'Cancelled' };
            var DEFAULT_INCLUDES = 'Professional bartenders\nAll tools, glassware, ice, mixers, and garnishes (you supply the alcohol)\nCustom menu design\nMocktail lineup\nPremium, creative garnishes';

            var quotes = [];
            var filter = 'all';
            var replyId = null;

            var loginView = document.getElementById('loginView');
            var dashView = document.getElementById('dashView');
            var listEl = document.getElementById('list');
            var filtersEl = document.getElementById('filters');
            var emptyMsg = document.getElementById('emptyMsg');

            function fmtDate(iso) {
                if (!iso) return '';
                try { return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
                catch (e) { return iso; }
            }

            // ---------- Auth ----------
            function showLogin() { loginView.style.display = 'flex'; dashView.style.display = 'none'; }
            function showDash() { loginView.style.display = 'none'; dashView.style.display = ''; }

            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('adUser').value, password: document.getElementById('adPass').value })
                }).then(function (r) {
                    if (!r.ok) throw new Error('Invalid credentials');
                    showDash();
                    load();
                }).catch(function (e) { document.getElementById('loginError').textContent = e.message; });
            });

            document.getElementById('btnLogout').addEventListener('click', function () {
                fetch('/api/admin/logout', { method: 'POST' }).then(function () { showLogin(); });
            });

            // ---------- Data ----------
            function load() {
                fetch('/api/admin/quotes').then(function (r) {
                    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
                    return r.json();
                }).then(function (data) {
                    quotes = Array.isArray(data) ? data : [];
                    render();
                }).catch(function () { });
            }

            // ---------- Filters ----------
            function renderFilters() {
                filtersEl.innerHTML = '';
                var all = [{ key: 'all', label: 'All (' + quotes.length + ')' }].concat(STATUSES.map(function (s) {
                    var n = quotes.filter(function (q) { return (q.status || 'new') === s; }).length;
                    return { key: s, label: STATUS_LABELS[s] + ' (' + n + ')' };
                }));
                all.forEach(function (f) {
                    var b = document.createElement('button');
                    b.className = 'chip' + (filter === f.key ? ' on' : '');
                    b.textContent = f.label;
                    b.addEventListener('click', function () { filter = f.key; render(); });
                    filtersEl.appendChild(b);
                });
            }

            // ---------- List ----------
            function row(label, value, href) {
                if (!value) return null;
                var d = document.createElement('div');
                var l = document.createElement('div');
                l.className = 'ad-label';
                l.textContent = label;
                var v = document.createElement('div');
                v.className = 'ad-value';
                if (href) {
                    var a = document.createElement('a');
                    a.href = href;
                    a.textContent = value;
                    a.style.cssText = 'color:#cfe8ca;text-decoration:none;';
                    v.appendChild(a);
                } else {
                    v.textContent = value;
                }
                d.appendChild(l);
                d.appendChild(v);
                return d;
            }

            function render() {
                renderFilters();
                listEl.innerHTML = '';
                var visible = filter === 'all' ? quotes : quotes.filter(function (q) { return (q.status || 'new') === filter; });
                emptyMsg.style.display = visible.length ? 'none' : '';

                visible.forEach(function (q) {
                    var card = document.createElement('div');
                    card.className = 'ad-card';

                    // Header line: name + service + status select
                    var head = document.createElement('div');
                    head.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px;';
                    var title = document.createElement('div');
                    var isBar = q.service_type === 'bar-services';
                    title.innerHTML = '<div style="font-size:20px;font-weight:800;">' + '</div>';
                    title.firstChild.textContent = q.name || '(no name)';
                    var sub = document.createElement('div');
                    sub.style.cssText = 'font-size:13px;color:#9b97b3;margin-top:2px;';
                    sub.textContent = (isBar ? 'Bar at an event' : 'Cocktail workshop') + (q.event_type ? ' · ' + q.event_type : '') + ' · received ' + fmtDate(q.created_at);
                    title.appendChild(sub);

                    var sel = document.createElement('select');
                    sel.className = 'status-select st-' + (q.status || 'new');
                    STATUSES.forEach(function (s) {
                        var o = document.createElement('option');
                        o.value = s;
                        o.textContent = STATUS_LABELS[s];
                        if ((q.status || 'new') === s) o.selected = true;
                        sel.appendChild(o);
                    });
                    sel.addEventListener('change', function () {
                        fetch('/api/admin/update_status', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: q.id, status: sel.value })
                        }).then(function (r) {
                            if (!r.ok) throw new Error();
                            q.status = sel.value;
                            render();
                        }).catch(function () { alert('Failed to update status'); });
                    });

                    head.appendChild(title);
                    head.appendChild(sel);
                    card.appendChild(head);

                    // Details grid
                    var grid = document.createElement('div');
                    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 20px;margin-bottom:16px;';
                    [row('Email', q.email, 'mailto:' + q.email),
                     row('Phone', q.phone, q.phone ? 'tel:' + q.phone : null),
                     row('Event date', q.event_date),
                     row('Guests', q.guest_count),
                     row('Location', q.location)].forEach(function (r) { if (r) grid.appendChild(r); });
                    card.appendChild(grid);

                    // Message
                    if (q.message) {
                        var msg = document.createElement('div');
                        msg.style.cssText = 'padding:14px 16px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(207,232,202,0.08);margin-bottom:16px;';
                        msg.innerHTML = '<div class="ad-label" style="margin-bottom:6px;">Message</div>';
                        var p = document.createElement('div');
                        p.style.cssText = 'font-size:14px;line-height:1.6;color:#cdc9dc;white-space:pre-wrap;';
                        p.textContent = q.message;
                        msg.appendChild(p);
                        card.appendChild(msg);
                    }

                    // Menu selection (if submitted)
                    if (q.menu_selection) {
                        try {
                            var selData = JSON.parse(q.menu_selection);
                            var mwrap = document.createElement('div');
                            mwrap.style.cssText = 'padding:14px 16px;border-radius:12px;background:linear-gradient(165deg,rgba(91,89,184,0.14),rgba(255,255,255,0.02));border:1px solid rgba(207,232,202,0.16);margin-bottom:16px;';
                            mwrap.innerHTML = '<div class="ad-label" style="margin-bottom:8px;">Menu submitted ' + fmtDate(q.menu_submitted_at) + ' · ' + (selData.package === '4-1' ? '4 cocktails + 1 mocktail' : '3 cocktails + 2 mocktails') + '</div>';
                            var lists = document.createElement('div');
                            lists.style.cssText = 'font-size:14px;line-height:1.7;color:#f2eee8;font-weight:600;';
                            lists.textContent = 'Cocktails: ' + (selData.cocktails || []).join(', ');
                            var m2 = document.createElement('div');
                            m2.style.cssText = 'font-size:14px;line-height:1.7;color:#f2eee8;font-weight:600;';
                            m2.textContent = 'Mocktails: ' + (selData.mocktails || []).join(', ');
                            mwrap.appendChild(lists);
                            mwrap.appendChild(m2);
                            card.appendChild(mwrap);
                        } catch (e) { }
                    }

                    // Actions
                    var actions = document.createElement('div');
                    actions.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;';

                    var btnReply = document.createElement('button');
                    btnReply.className = 'btn-mint';
                    btnReply.style.cssText = 'font-size:13px;padding:11px 20px;';
                    btnReply.textContent = 'Reply with quote';
                    btnReply.addEventListener('click', function () { openReply(q); });
                    actions.appendChild(btnReply);

                    var btnDeposit = document.createElement('button');
                    btnDeposit.className = 'ad-btn';
                    btnDeposit.textContent = 'Deposit received';
                    btnDeposit.addEventListener('click', function () {
                        if (!confirm('Mark deposit received and email ' + q.email + ' a thank-you with their menu-builder link?')) return;
                        btnDeposit.disabled = true;
                        btnDeposit.textContent = 'Sending…';
                        fetch('/api/admin/deposit_received', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: q.id })
                        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                            .then(function (res) {
                                if (!res.ok) throw new Error(res.j.error || 'Failed');
                                load();
                            })
                            .catch(function (e) {
                                alert(e.message);
                                btnDeposit.disabled = false;
                                btnDeposit.textContent = 'Deposit received';
                            });
                    });
                    actions.appendChild(btnDeposit);

                    var btnMenu = document.createElement('button');
                    btnMenu.className = 'ad-btn';
                    btnMenu.textContent = q.menu_token ? 'Resend menu link' : 'Send menu link';
                    btnMenu.addEventListener('click', function () {
                        if (!confirm('Email a personal menu-builder link to ' + q.email + '?')) return;
                        btnMenu.disabled = true;
                        btnMenu.textContent = 'Sending…';
                        fetch('/api/admin/send_menu_link', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: q.id })
                        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                            .then(function (res) {
                                if (!res.ok) throw new Error(res.j.error || 'Failed');
                                btnMenu.textContent = 'Link sent ✓';
                                q.menu_token = q.menu_token || 'sent';
                            })
                            .catch(function (e) { alert(e.message); btnMenu.textContent = 'Send menu link'; })
                            .finally(function () { btnMenu.disabled = false; });
                    });
                    actions.appendChild(btnMenu);

                    if (q.menu_token && !q.menu_selection) {
                        var pill = document.createElement('span');
                        pill.className = 'ad-pill';
                        pill.textContent = 'Menu link sent, waiting';
                        actions.appendChild(pill);
                    }

                    card.appendChild(actions);
                    listEl.appendChild(card);
                });
            }

            // ---------- Reply modal ----------
            var modal = document.getElementById('replyModal');
            function openReply(q) {
                replyId = q.id;
                document.getElementById('replyTo').textContent = 'To ' + q.name + ' <' + q.email + '>' + (q.event_date ? ' · event on ' + q.event_date : '');
                document.getElementById('rSubject').value = 'Your Barshtender quote' + (q.event_date ? ' - ' + q.event_date : '');
                document.getElementById('rPrice').value = '';
                document.getElementById('rIncludes').value = DEFAULT_INCLUDES;
                document.getElementById('rMessage').value = '';
                document.getElementById('replyError').textContent = '';
                modal.classList.add('open');
            }
            document.getElementById('replyClose').addEventListener('click', function () { modal.classList.remove('open'); });
            modal.addEventListener('mousedown', function (e) { if (e.target === modal) modal.classList.remove('open'); });

            document.getElementById('replySend').addEventListener('click', function () {
                var btn = this;
                var payload = {
                    id: replyId,
                    subject: document.getElementById('rSubject').value.trim(),
                    price: document.getElementById('rPrice').value.trim(),
                    includes: document.getElementById('rIncludes').value,
                    message: document.getElementById('rMessage').value.trim()
                };
                if (!payload.price && !payload.message) {
                    document.getElementById('replyError').textContent = 'Add a price or a message before sending.';
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Sending…';
                fetch('/api/admin/reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                    .then(function (res) {
                        if (!res.ok) throw new Error(res.j.error || 'Failed to send');
                        modal.classList.remove('open');
                        load();
                    })
                    .catch(function (e) { document.getElementById('replyError').textContent = e.message; })
                    .finally(function () { btn.disabled = false; btn.textContent = 'Send quote email'; });
            });

            // ---------- Boot: try loading; 401 shows login ----------
            fetch('/api/admin/quotes').then(function (r) {
                if (r.status === 401) { showLogin(); return null; }
                return r.json();
            }).then(function (data) {
                if (data) { quotes = Array.isArray(data) ? data : []; showDash(); render(); }
            }).catch(function () { showLogin(); });
        })();
    </script>
</body>

</html>
